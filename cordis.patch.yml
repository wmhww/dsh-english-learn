# dsh-english-learn bundle patch: inserts the dual-face plugin row into the web
# profile roster. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field) over dsh-base; activate with
# `dsh plugin --profile desktop add link:<path-to-this-package>`.
#
# The row is a bare plugin by package name: the node half (exports ".") runs in
# the host process, and the `dsh.client` declaration in package.json makes the
# browser half (exports "./client", served at /plugins/<id>/client.js) load in
# the web GUI, where it seats the sidebar toggle, the overlay panel and the
# first-level Settings page.
- insert:
    - id: english-learn
      name: dsh-english-learn
